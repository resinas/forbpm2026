<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-label="Stylized realistic Toronto skyline with CN Tower and waterfront">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8e7f2" />
      <stop offset="36%" stop-color="#c6dce8" />
      <stop offset="64%" stop-color="#b8d0d8" />
      <stop offset="100%" stop-color="#9fb9c2" />
    </linearGradient>

    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.45)" />
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ca0ad" />
      <stop offset="48%" stop-color="#688a97" />
      <stop offset="100%" stop-color="#4f6e7a" />
    </linearGradient>

    <linearGradient id="shore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a757d" />
      <stop offset="100%" stop-color="#425d65" />
    </linearGradient>

    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f98a0" />
      <stop offset="100%" stop-color="#5b7178" />
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
  </defs>

  <rect width="1800" height="1000" fill="url(#sky)" />

  <g opacity="0.28" filter="url(#soft)">
    <ellipse cx="340" cy="210" rx="180" ry="52" fill="#ffffff" />
    <ellipse cx="610" cy="170" rx="220" ry="60" fill="#f7fbff" />
    <ellipse cx="980" cy="220" rx="240" ry="64" fill="#ffffff" />
    <ellipse cx="1330" cy="180" rx="210" ry="58" fill="#f6fbff" />
  </g>

  <g fill="#6a828b" opacity="0.9">
    <rect x="90" y="470" width="80" height="220" />
    <rect x="176" y="440" width="102" height="250" />
    <rect x="286" y="455" width="75" height="235" />
    <rect x="365" y="405" width="122" height="285" />
    <rect x="497" y="440" width="90" height="250" />
    <rect x="592" y="420" width="115" height="270" />
    <rect x="718" y="450" width="72" height="240" />
    <rect x="796" y="390" width="130" height="300" />
    <rect x="936" y="425" width="100" height="265" />
    <rect x="1044" y="445" width="82" height="245" />
    <rect x="1132" y="408" width="136" height="282" />
    <rect x="1274" y="438" width="92" height="252" />
    <rect x="1372" y="415" width="118" height="275" />
    <rect x="1498" y="452" width="88" height="238" />
    <rect x="1592" y="432" width="94" height="258" />
  </g>

  <g fill="#7b949d" opacity="0.42">
    <rect x="110" y="510" width="40" height="180" />
    <rect x="205" y="500" width="30" height="190" />
    <rect x="382" y="470" width="38" height="220" />
    <rect x="544" y="485" width="35" height="205" />
    <rect x="842" y="460" width="42" height="230" />
    <rect x="1166" y="470" width="39" height="220" />
    <rect x="1402" y="465" width="40" height="225" />
  </g>

  <g>
    <polygon points="882,190 916,690 848,690" fill="url(#tower)" />
    <rect x="839" y="328" width="86" height="24" rx="7" fill="#6f8892" />
    <ellipse cx="882" cy="340" rx="80" ry="15" fill="#738f98" opacity="0.85" />
    <rect x="864" y="254" width="36" height="14" rx="4" fill="#748f99" />
    <rect x="879" y="202" width="7" height="54" fill="#5d737a" />
  </g>

  <rect y="690" width="1800" height="310" fill="url(#water)" />
  <rect y="675" width="1800" height="20" fill="#7a99a3" opacity="0.55" />

  <g opacity="0.18">
    <rect x="120" y="728" width="300" height="4" fill="#d7e4e8" />
    <rect x="520" y="750" width="260" height="4" fill="#d7e4e8" />
    <rect x="860" y="734" width="340" height="4" fill="#d7e4e8" />
    <rect x="1260" y="756" width="300" height="4" fill="#d7e4e8" />
    <rect x="230" y="786" width="220" height="4" fill="#d7e4e8" />
    <rect x="640" y="808" width="320" height="4" fill="#d7e4e8" />
    <rect x="1080" y="796" width="290" height="4" fill="#d7e4e8" />
  </g>

  <g opacity="0.78" fill="url(#shore)">
    <path d="M0 812 C180 794, 360 834, 540 818 C710 802, 900 768, 1080 796 C1250 822, 1460 850, 1800 824 L1800 1000 L0 1000 Z"/>
  </g>

  <rect width="1800" height="1000" fill="url(#haze)" />
</svg>
